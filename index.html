<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Tâm Toán Cô Huyền - Nền Tảng Học Toán Vững Chắc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'primary-blue': '#1a56db',
                        'secondary-orange': '#f59e0b',
                        'light-bg': '#f9fafb',
                        'accent-green': '#10b981',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .btn-primary { @apply bg-primary-blue text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:bg-blue-700 transition duration-300 transform hover:-translate-y-0.5; }
        .btn-secondary { @apply bg-secondary-orange text-white font-semibold py-3 px-6 rounded-xl shadow-lg hover:bg-amber-600 transition duration-300 transform hover:-translate-y-0.5; }
        .card { @apply bg-white p-6 md:p-8 rounded-3xl shadow-2xl border border-gray-100; }
        .input-field { @apply w-full p-3 border-2 border-gray-200 rounded-xl mt-1 focus:outline-none focus:border-primary-blue focus:ring-4 focus:ring-primary-blue/20 transition duration-200; }
        .nav-item { @apply cursor-pointer p-2 hover:text-secondary-orange transition duration-200 font-medium; }
        .nav-item.active { @apply text-secondary-orange font-bold border-b-3 border-secondary-orange; }
        
        .modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.7); z-index: 1000;
            display: flex; justify-content: center; align-items: center;
        }

        .responsive-table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
        }
        .responsive-table th, .responsive-table td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }
        .responsive-table th {
            background-color: #eef2ff;
            text-align: left;
            font-weight: bold;
            color: #1a56db;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .responsive-table tr:last-child td {
            border-bottom: none;
        }
        .responsive-table tbody tr:hover {
            background-color: #f5f8ff;
        }
    </style>
</head>
<body class="text-gray-800">

    <nav class="bg-white shadow-xl sticky top-0 z-50">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="app.renderHome()">
                    <i class="fas fa-brain text-4xl text-primary-blue group-hover:scale-110 transition duration-300"></i>
                    <div>
                        <h1 class="text-2xl font-extrabold text-primary-blue">CÔ HUYỀN MATH</h1>
                        <p class="text-xs text-secondary-orange font-semibold">Nền tảng tri thức vững chắc</p>
                    </div>
                </div>
                
                <div id="navLinks" class="hidden md:flex space-x-6 text-gray-600">
                </div>

                <div id="authButtons">
                </div>
            </div>
        </div>
    </nav>

    <div id="mainContent" class="container mx-auto px-4 sm:px-6 lg:px-8 py-12 min-h-screen">
    </div>

    <div id="modalContainer"></div>

    <footer class="bg-primary-blue text-white py-10 mt-16 shadow-inner">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="flex flex-col md:flex-row justify-center items-center md:space-x-8">
                <p class="font-bold text-xl mb-2 md:mb-0">TRUNG TÂM TOÁN CÔ HUYỀN</p>
                <div class="h-6 w-0.5 bg-blue-300 hidden md:block"></div>
                <p class="text-sm">Liên hệ: <span class="font-semibold">0912.XXX.XXX</span> | Email: <span class="font-semibold">côhuyenmath@edu.vn</span></p>
            </div>
            <p class="mt-4 text-xs opacity-70">© 2024 Math Center. Phát triển bởi trí tuệ nhân tạo. All rights reserved.</p>
        </div>
    </footer>

    <script>
        // ================================
        // HỆ THỐNG LOCALSTORAGE AN TOÀN 100%
        // ================================
        const DB_KEYS = {
            USERS: 'users',
            CURRENT_USER: 'currentUser',
            ATTENDANCE: 'attendance',
            FEES: 'fees',
            ASSIGNMENTS: 'assignments',
            MATERIALS: 'materials',
            SCHEDULE: 'schedule'
        };

        const db = {
            get(key, defaultValue = []) {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    console.error("Lỗi parse LocalStorage key:", key, e);
                    localStorage.removeItem(key);
                    return defaultValue;
                }
            },
            set(key, value) {
                try {
                    localStorage.setItem(key, JSON.stringify(value));
                    return true;
                } catch (e) {
                    console.error("Lỗi ghi LocalStorage:", key, e);
                    alert("Không thể lưu dữ liệu. Vui lòng thử lại!");
                    return false;
                }
            },
            init() {
                let users = this.get(DB_KEYS.USERS, []);
                if (!users.some(u => u.username === 'admin')) {
                    users.push({
                        id: 'admin',
                        name: 'Cô Huyền (Admin)',
                        role: 'teacher',
                        username: 'admin',
                        password: '123'
                    });
                    this.set(DB_KEYS.USERS, users);
                }
                if (!localStorage.getItem(DB_KEYS.ATTENDANCE)) this.set(DB_KEYS.ATTENDANCE, {});
                if (!localStorage.getItem(DB_KEYS.FEES)) this.set(DB_KEYS.FEES, {});
                if (!localStorage.getItem(DB_KEYS.ASSIGNMENTS)) this.set(DB_KEYS.ASSIGNMENTS, []);
                if (!localStorage.getItem(DB_KEYS.MATERIALS)) this.set(DB_KEYS.MATERIALS, []);
                if (!localStorage.getItem(DB_KEYS.SCHEDULE)) this.set(DB_KEYS.SCHEDULE, []);
            }
        };

        db.init();

        let currentUser = null;
        try {
            const saved = localStorage.getItem(DB_KEYS.CURRENT_USER);
            if (saved) currentUser = JSON.parse(saved);
        } catch(e) {
            localStorage.removeItem(DB_KEYS.CURRENT_USER);
        }

        let currentClassView = currentUser?.classId || '4.1';

        const CONSTANTS = {
            FEE_PER_SESSION: 90000,
            SESSIONS_PER_COURSE: 12,
            CLASSES: []
        };
        for (let i = 4; i <= 9; i++) {
            for (let j = 1; j <= 3; j++) {
                CONSTANTS.CLASSES.push(`${i}.${j}`);
            }
        }

        const TEACHER_INFO = {
            name: 'Cô Huyền',
            experience: 'Nhiều năm kinh nghiệm giảng dạy Toán, chuyên luyện thi chuyển cấp. Cô là người sáng lập và quản lý chương trình học, đảm bảo chất lượng đầu ra cho mọi học sinh.',
            philosophy: 'Học Toán không chỉ là giải bài tập, mà là phát triển tư duy logic và khả năng giải quyết vấn đề.',
            image: 'https://picsum.photos/200/200?random=2'
        };

        // ================================
        // AUTH
        // ================================
        const auth = {
            login(username, password) {
                const users = db.get(DB_KEYS.USERS, []);
                const user = users.find(u => (u.username === username || u.phone === username) && u.password === password);
                if (user) {
                    currentUser = user;
                    db.set(DB_KEYS.CURRENT_USER, user);
                    currentClassView = user.classId || CONSTANTS.CLASSES[0];
                    app.init();
                    return true;
                }
                return false;
            },
            register(name, phone, password, role, classId) {
                const users = db.get(DB_KEYS.USERS, []);
                if (users.find(u => u.phone === phone)) return false;

                const newUser = {
                    id: Date.now().toString(),
                    name, phone, password, role, classId
                };
                users.push(newUser);
                db.set(DB_KEYS.USERS, users);
                return true;
            },
            logout() {
                currentUser = null;
                localStorage.removeItem(DB_KEYS.CURRENT_USER);
                app.renderLandingPage();
                app.renderNavbar();
            }
        };

        // ================================
        // APP
        // ================================
        const app = {
            init() {
                db.init();
                this.renderNavbar();
                if (currentUser) {
                    this.renderDashboard();
                } else {
                    this.renderLandingPage();
                }
            },

            getRoleName(role) {
                if (role === 'teacher') return 'Giáo Viên';
                if (role === 'student') return 'Học Sinh';
                if (role === 'parent') return 'Phụ Huynh';
                return '';
            },

            renderNavbar() {
                const navLinks = document.getElementById('navLinks');
                const authBtns = document.getElementById('authButtons');

                if (currentUser) {
                    let linksHtml = `
                        <span class="nav-item" data-page="dashboard" onclick="app.renderDashboard()">Dashboard</span>
                        <span class="nav-item" data-page="schedule" onclick="app.renderSchedule()">Lịch Học</span>
                        <span class="nav-item" data-page="materials" onclick="app.renderMaterials()">Tài Liệu</span>
                    `;

                    if (currentUser.role === 'teacher') {
                        linksHtml += `
                            <span class="nav-item" data-page="class" onclick="app.renderClassManagement()">Lớp & HS</span>
                            <span class="nav-item" data-page="attendance" onclick="app.renderAttendance()">Điểm Danh</span>
                            <span class="nav-item" data-page="fees" onclick="app.renderFees()">Học Phí</span>
                            <span class="nav-item" data-page="homework" onclick="app.renderHomework()">Bài Tập</span>
                        `;
                    } else if (currentUser.role === 'student') {
                        linksHtml += `<span class="nav-item" data-page="student-homework" onclick="app.renderStudentHomework()">Làm Bài</span>`;
                    } else if (currentUser.role === 'parent') {
                        linksHtml += `<span class="nav-item" data-page="fees" onclick="app.renderFees()">Học Phí Con</span>`;
                    }

                    navLinks.innerHTML = linksHtml;
                    authBtns.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-sm font-semibold text-primary-blue hidden lg:block">
                                <i class="fas fa-user-circle mr-1"></i> ${currentUser.name} (${this.getRoleName(currentUser.role)})
                            </span>
                            <button onclick="auth.logout()" class="text-red-600 hover:text-red-800 font-bold text-sm p-2 rounded-lg bg-red-50 hover:bg-red-100 transition shadow-md">
                                <i class="fas fa-sign-out-alt mr-1"></i> Đăng xuất
                            </button>
                        </div>`;
                } else {
                    navLinks.innerHTML = `<span class="nav-item active" data-page="landing" onclick="app.renderLandingPage()">Giới Thiệu</span>`;
                    authBtns.innerHTML = `<button onclick="app.renderLogin()" class="btn-primary text-sm !py-2 !px-4">ĐĂNG NHẬP <i class="fas fa-arrow-right ml-1"></i></button>`;
                }
            },

            setActiveNav(page) {
                document.querySelectorAll('#navLinks .nav-item').forEach(el => {
                    el.classList.remove('active');
                    if (el.dataset.page === page) el.classList.add('active');
                });
            },

            renderHome() { this.renderLandingPage(); },

            renderLandingPage() {
                this.setActiveNav('landing');
                document.getElementById('mainContent').innerHTML = `
                    <header class="bg-primary-blue rounded-3xl p-8 md:p-16 text-white mb-16 shadow-2xl flex flex-col md:flex-row items-center justify-between">
                        <div class="md:w-3/5">
                            <h1 class="text-5xl md:text-7xl font-extrabold mb-4 leading-tight">Nền Tảng Toán <br><span class="text-secondary-orange">Vững Chắc</span> Cùng Cô Huyền</h1>
                            <p class="text-xl opacity-90 mb-8">Chương trình bồi dưỡng chuyên sâu từ lớp 4 đến lớp 9, giúp học sinh phát triển tư duy logic và đạt kết quả cao nhất.</p>
                            <div class="space-x-4">
                                <button onclick="app.renderRegister()" class="btn-secondary !py-4 !px-8 !text-lg !font-bold">Đăng Ký Học Thử Ngay <i class="fas fa-arrow-circle-right ml-2"></i></button>
                                <button onclick="app.renderLogin()" class="bg-white text-primary-blue py-4 px-8 rounded-xl font-bold hover:bg-gray-100 transition shadow-lg">Đăng Nhập Hệ Thống</button>
                            </div>
                        </div>
                        <div class="md:w-2/5 mt-10 md:mt-0 flex justify-center">
                            <i class="fas fa-calculator text-[10r
                                                        <i class="fas fa-calculator text-[10rem] opacity-30"></i>
                        </div>
                    </header>

                    <section class="mb-16">
                        <div class="card grid grid-cols-1 lg:grid-cols-3 gap-8 items-center bg-light-bg">
                            <div class="lg:col-span-2">
                                <h2 class="text-4xl font-extrabold text-secondary-orange mb-4">Về Giáo Viên: ${TEACHER_INFO.name}</h2>
                                <p class="text-gray-700 text-lg mb-4">${TEACHER_INFO.experience}</p>
                                <blockquote class="border-l-4 border-primary-blue pl-4 italic text-gray-600 font-medium">
                                    "${TEACHER_INFO.philosophy}"
                                </blockquote>
                                <div class="mt-6">
                                    <span class="text-primary-blue font-bold text-lg">Phương Pháp Độc Quyền</span>
                                </div>
                            </div>
                            <div class="lg:col-span-1 flex justify-center">
                                <img src="${TEACHER_INFO.image}" alt="Hình ảnh Cô Huyền" class="w-48 h-48 rounded-full object-cover shadow-2xl border-4 border-white transform hover:scale-105 transition duration-500">
                            </div>
                        </div>
                    </section>

                    <section class="mb-16">
                        <h2 class="text-center text-4xl font-extrabold text-primary-blue mb-12">Tại Sao Chọn Cô Huyền Math?</h2>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            <div class="card text-center transition duration-300 hover:shadow-primary-blue/30 hover:shadow-2xl">
                                <i class="fas fa-user-check text-5xl text-accent-green mb-4"></i>
                                <h3 class="text-xl font-bold mb-2">Quản Lý Chuyên Cần</h3>
                                <p class="text-gray-600">Hệ thống theo dõi điểm danh, học phí và bài tập trực tuyến, minh bạch.</p>
                            </div>
                            <div class="card text-center transition duration-300 hover:shadow-primary-blue/30 hover:shadow-2xl">
                                <i class="fas fa-book-reader text-5xl text-secondary-orange mb-4"></i>
                                <h3 class="text-xl font-bold mb-2">Kho Tài Liệu Số</h3>
                                <p class="text-gray-600">Tài liệu, đề thi, chuyên đề được cập nhật thường xuyên, truy cập mọi lúc.</p>
                            </div>
                            <div class="card text-center transition duration-300 hover:shadow-primary-blue/30 hover:shadow-2xl">
                                <i class="fas fa-layer-group text-5xl text-primary-blue mb-4"></i>
                                <h3 class="text-xl font-bold mb-2">Lộ Trình Cá Nhân Hóa</h3>
                                <p class="text-gray-600">Phân loại lớp học nhỏ từ 4.1 đến 9.3, đảm bảo phù hợp với trình độ từng học sinh.</p>
                            </div>
                        </div>
                    </section>
                `;
            },

            renderDashboard() {
                this.setActiveNav('dashboard');
                const roleName = this.getRoleName(currentUser.role);
                const isTeacher = currentUser.role === 'teacher';

                let content = '';

                if (isTeacher) {
                    const stats = this.getTeacherStats();

                    content = `
                        <div class="bg-gradient-to-r from-primary-blue to-blue-600 rounded-3xl p-8 md:p-12 text-white mb-10 shadow-2xl flex flex-col md:flex-row items-center justify-between">
                            <div class="md:w-3/4">
                                <h2 class="text-xl font-medium mb-2">Chào mừng trở lại, ${currentUser.name}!</h2>
                                <h1 class="text-4xl md:text-5xl font-extrabold mb-2">Bảng Điều Khiển Giáo Viên</h1>
                                <p class="text-lg opacity-90">Theo dõi tiến độ, quản lý lớp học và tài chính hiệu quả.</p>
                            </div>
                            <div class="md:w-1/4 mt-8 md:mt-0 flex justify-center">
                                <i class="fas fa-chart-bar text-9xl opacity-30"></i>
                            </div>
                        </div>

                        <h3 class="text-3xl font-extrabold text-primary-blue mb-6 border-b pb-2">Tổng Quan Hiệu Suất</h3>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
                            <div class="card p-5 border-l-8 border-primary-blue bg-white shadow-xl hover:shadow-2xl transition duration-300">
                                <i class="fas fa-users text-3xl text-primary-blue mb-3"></i>
                                <p class="text-gray-500 font-semibold text-sm">Tổng Học Sinh</p>
                                <p class="text-4xl font-extrabold text-gray-900 mt-1">${stats.totalStudents}</p>
                            </div>
                            <div class="card p-5 border-l-8 border-secondary-orange bg-white shadow-xl hover:shadow-2xl transition duration-300">
                                <i class="fas fa-layer-group text-3xl text-secondary-orange mb-3"></i>
                                <p class="text-gray-500 font-semibold text-sm">Số Lớp Đang Quản Lý</p>
                                <p class="text-4xl font-extrabold text-gray-900 mt-1">${stats.totalClasses}</p>
                            </div>
                            <div class="card p-5 border-l-8 border-red-500 bg-white shadow-xl hover:shadow-2xl transition duration-300">
                                <i class="fas fa-hourglass-half text-3xl text-red-500 mb-3"></i>
                                <p class="text-gray-500 font-semibold text-sm">Bài Tập Chờ Chấm</p>
                                <p class="text-4xl font-extrabold text-gray-900 mt-1">${stats.pendingHomework}</p>
                            </div>
                            <div class="card p-5 border-l-8 border-accent-green bg-white shadow-xl hover:shadow-2xl transition duration-300 cursor-pointer" onclick="app.renderFees()">
                                <i class="fas fa-coins text-3xl text-accent-green mb-3"></i>
                                <p class="text-gray-500 font-semibold text-sm">Tổng Doanh Thu Tạm Tính</p>
                                <p class="text-3xl font-extrabold text-accent-green mt-1">${stats.totalRevenue}₫</p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            <div class="lg:col-span-2 space-y-6">
                                <h3 class="text-3-temporal font-extrabold text-primary-blue mb-4 border-b pb-2">Công Cụ Quản Lý Nhanh</h3>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <button onclick="app.renderAttendance()" class="card !p-5 text-left flex items-center bg-blue-50 hover:bg-blue-100 transition duration-300 shadow-md">
                                        <i class="fas fa-clipboard-check text-4xl text-primary-blue mr-4"></i>
                                        <div><p class="font-bold text-lg">Điểm Danh Nhanh</p><p class="text-sm text-gray-600">Ghi nhận buổi học hôm nay.</p></div>
                                    </button>
                                    <button onclick="app.renderHomework()" class="card !p-5 text-left flex items-center bg-amber-50 hover:bg-amber-100 transition duration-300 shadow-md">
                                        <i class="fas fa-pencil-alt text-4xl text-secondary-orange mr-4"></i>
                                        <div><p class="font-bold text-lg">Chấm Bài/Giao Bài</p><p class="text-sm text-gray-600">Quản lý bài tập của học sinh.</p></div>
                                    </button>
                                    <button onclick="app.renderSchedule()" class="card !p-5 text-left flex items-center bg-green-50 hover:bg-green-100 transition duration-300 shadow-md">
                                        <i class="fas fa-calendar-alt text-4xl text-accent-green mr-4"></i>
                                        <div><p class="font-bold text-lg">Thêm Lịch Học</p><p class="text-sm text-gray-600">Thiết lập/sửa đổi lịch giảng dạy.</p></div>
                                    </button>
                                    <button onclick="app.renderClassManagement()" class="card !p-5 text-left flex items-center bg-red-50 hover:bg-red-100 transition duration-300 shadow-md">
                                        <i class="fas fa-users-cog text-4xl text-red-500 mr-4"></i>
                                        <div><p class="font-bold text-lg">Quản Lý Thành Viên</p><p class="text-sm text-gray-600">Kiểm tra danh sách học sinh/phụ huynh.</p></div>
                                    </button>
                                </div>
                            </div>

                            <div class="lg:col-span-1 card shadow-2xl border-t-4 border-secondary-orange h-fit">
                                <h3 class="text-2xl font-extrabold text-secondary-orange mb-4 border-b pb-2">Thông Tin Cá Nhân</h3>
                                <div class="flex flex-col items-center">
                                    <img src="${TEACHER_INFO.image}" alt="Cô Huyền" class="w-32 h-32 rounded-full object-cover shadow-lg border-4 border-white mb-4">
                                    <p class="text-2xl font-bold text-primary-blue">${TEACHER_INFO.name}</p>
                                    <p class="text-sm text-gray-500 mb-4">${this.getRoleName(currentUser.role)}</p>
                                </div>
                                <p class="text-gray-700 italic text-sm border-t pt-4 mt-4 whitespace-pre-wrap">
                                    <span class="font-bold text-primary-blue">Mục tiêu:</span> ${TEACHER_INFO.philosophy}
                                </p>
                            </div>
                        </div>
                    `;
                } else if (currentUser.role === 'student') {
                    content = `
                        <div class="bg-gradient-to-r from-primary-blue to-blue-500 rounded-3xl p-8 md:p-12 text-white mb-10 shadow-2xl flex flex-col md:flex-row items-center justify-between">
                            <div class="md:w-2/3">
                                <h2 class="text-xl font-medium mb-2">Xin chào, ${currentUser.name}!</h2>
                                <h1 class="text-4xl md:text-5xl font-extrabold mb-4">Dashboard Học Sinh - Lớp ${currentUser.classId}</h1>
                                <p class="text-lg mb-6 opacity-90">Theo dõi thông tin và quản lý học tập một cách trực quan.</p>
                                <button class="btn-secondary !bg-secondary-orange !px-6 !py-3 !text-lg" onclick="app.renderStudentHomework()">BẮT ĐẦU LÀM BÀI</button>
                            </div>
                            <div class="md:w-1/3 mt-8 md:mt-0 flex justify-center">
                                <i class="fas fa-graduation-cap text-9xl opacity-30"></i>
                            </div>
                        </div>

                                            <div class="space-x-3 mt-3 sm:mt-0">
                                                <button onclick="showScheduleModal('${s.id}')" class="text-blue-500 hover:text-blue-700 font-medium text-sm p-2 rounded-lg hover:bg-blue-50 transition">Sửa</button>
                                                <button onclick="deleteSchedule('${s.id}')" class="text-red-500 hover:text-red-700 font-medium text-sm p-2 rounded-lg hover:bg-red-50 transition">Xóa</button>
                                            </div>` : ''}
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                `;
            },

            renderMaterials() {
                this.setActiveNav('materials');
                const isTeacher = currentUser.role === 'teacher';
                const classToView = isTeacher ? currentClassView : (currentUser?.classId || CONSTANTS.CLASSES[0]);
                const materials = db.get(DB_KEYS.MATERIALS, []).filter(m => m.classId === classToView);

                document.getElementById('mainContent').innerHTML = `
                    <div class="card shadow-2xl border-t-4 border-primary-blue">
                        <div class="flex flex-wrap justify-between items-center mb-8 border-b-4 pb-4 border-secondary-orange/20">
                            <h2 class="text-4xl font-extrabold text-primary-blue">Kho Tài Liệu Lớp ${classToView}</h2>
                            ${isTeacher ? `<button onclick="showMaterialModal()" class="btn-secondary mt-4 sm:mt-0 !py-2 !px-4">Tải Lên Tài Liệu</button>` : ''}
                        </div>

                        ${isTeacher ? `
                            <div class="mb-6 p-4 bg-light-bg rounded-xl shadow-inner flex items-center gap-3 border border-gray-200">
                                <label class="font-bold text-gray-700 whitespace-nowrap">Xem/Quản lý Tài liệu cho Lớp:</label>
                                <select id="materialClassSelect" class="input-field !p-2" onchange="app.updateClassView(this.value, 'materials')">
                                    ${CONSTANTS.CLASSES.map(c => `<option value="${c}" ${c === currentClassView ? 'selected' : ''}>Lớp ${c}</option>`).join('')}
                                </select>
                            </div>` : ''}

                        <div id="materialContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${materials.length === 0 ? `<p class="text-gray-500 p-6 border rounded-xl text-center bg-yellow-50 col-span-2">Chưa có tài liệu nào cho lớp ${classToView}.</p>` :
                                materials.map(m => `
                                    <div class="p-5 border-l-4 border-primary-blue rounded-xl bg-white shadow-lg flex flex-col justify-between hover:shadow-xl transition">
                                        <div class="flex justify-between items-start gap-4">
                                            <div class="flex-grow">
                                                <p class="font-extrabold text-xl text-gray-800">${m.title}</p>
                                                <p class="text-xs text-secondary-orange font-semibold mt-1">${m.type}</p>
                                            </div>
                                            <i class="fas fa-file-pdf text-4xl text-red-500 flex-shrink-0 opacity-70"></i>
                                        </div>
                                        <div class="mt-4 pt-3 border-t border-gray-100 flex justify-between items-center">
                                            <a href="${m.link}" target="_blank" class="text-primary-blue font-bold text-sm hover:underline hover:text-blue-700 transition">Tải Xuống</a>
                                            ${isTeacher ? `<button onclick="deleteMaterial('${m.id}')" class="text-red-500 hover:text-red-700 text-sm p-1 rounded-lg hover:bg-red-50 transition">Xóa</button>` : ''}
                                        </div>
                                    </div>
                                `).join('')}
                        </div>
                    </div>
                `;
            },

            renderStudentHomework() {
                this.setActiveNav('student-homework');
                if (currentUser.role !== 'student') return;

                const assignments = db.get(DB_KEYS.ASSIGNMENTS, []);
                const myAssignments = assignments.filter(a => !a.studentId && a.classId === currentUser.classId);
                const mySubmissions = assignments.filter(a => a.studentId === currentUser.id);

                document.getElementById('mainContent').innerHTML = `
                    <div class="card shadow-2xl border-t-4 border-primary-blue">
                        <h2 class="text-4xl font-extrabold text-primary-blue mb-8">Bài Tập Cần Làm - Lớp ${currentUser.classId}</h2>
                        <div class="space-y-6">
                            ${myAssignments.length === 0 ? '<p class="text-gray-500 p-6 border rounded-xl text-center bg-accent-green/10 text-accent-green font-bold">Hiện tại không có bài tập nào mới. Hãy thư giãn!</p>' :
                                myAssignments.map(hw => {
                                    const sub = mySubmissions.find(s => s.parentId === hw.id);
                                    let statusHtml, statusColor;
                                    if (sub) {
                                        if (sub.score !== null) {
                                            statusHtml = `<span class="bg-accent-green text-white px-3 py-1 rounded-full font-bold shadow-md">ĐÃ CHẤM: ${sub.score} Đ</span>`;
                                            statusColor = 'border-accent-green';
                                        } else {
                                            statusHtml = `<span class="bg-yellow-500 text-white px-3 py-1 rounded-full font-bold shadow-md">CHỜ CHẤM</span>`;
                                            statusColor = 'border-yellow-500';
                                        }
                                    } else {
                                        statusHtml = `<span class="bg-red-500 text-white px-3 py-1 rounded-full font-bold shadow-md">CHƯA LÀM</span>`;
                                        statusColor = 'border-red-500';
                                    }

                                    return `
                                        <div class="border-l-8 ${statusColor} rounded-xl p-5 bg-white shadow-lg hover:shadow-xl transition">
                                            <div class="flex justify-between items-start">
                                                <div>
                                                    <h4 class="font-extrabold text-2xl text-primary-blue mb-1">${hw.title}</h4>
                                                    <p class="text-gray-600 text-sm mb-3 italic">${hw.desc}</p>
                                                    <a href="${hw.link}" target="_blank" class="text-secondary-orange font-bold hover:underline transition">Xem Đề Bài Chi Tiết</a>
                                                </div>
                                                <div class="text-right flex-shrink-0">${statusHtml}</div>
                                            </div>
                                            ${!sub ? `
                                                <div class="mt-4 pt-4 border-t border-gray-100">
                                                    <p class="text-sm font-bold mb-2 text-gray-700">Nộp Bài Tự Luận/Link File Bài Làm:</p>
                                                    <div class="flex flex-col sm:flex-row gap-3">
                                                        <input type="text" id="ans-${hw.id}" class="input-field text-sm flex-grow !p-2" placeholder="Nhập tóm tắt, đáp án hoặc link file ảnh/pdf...">
                                                        <button onclick="submitHomework('${hw.id}')" class="btn-secondary !py-2 !px-4 whitespace-nowrap">Nộp Bài</button>
                                                    </div>
                                                </div>` :
                                                sub && sub.score !== null ? `
                                                <div class="mt-4 pt-4 border-t border-gray-100 p-3 bg-gray-50 rounded-lg">
                                                    <p class="font-bold text-sm text-gray-700">Nội dung đã nộp:</p>
                                                    <p class="text-sm italic whitespace-pre-wrap">${sub.answerText}</p>
                                                </div>` :
                                                `<div class="mt-4 pt-4 border-t border-gray-100 p-3 bg-yellow-50 rounded-lg border-l-4 border-yellow-400">
                                                    <p class="font-bold text-sm text-yellow-800">Bài của bạn đã được nộp và đang chờ giáo viên chấm điểm.</p>
                                                </div>`}
                                        </div>`;
                                }).join('')}
                        </div>
                    </div>
                `;
            },

            calculateTotalRevenue() {
                const fees = db.get(DB_KEYS.FEES, {});
                let total = 0;
                Object.values(fees).forEach(f => total += (f.paidCount || 0) * CONSTANTS.FEE_PER_SESSION);
                return total;
            },

            updateClassView(newClassId, section) {
                currentClassView = newClassId;
                if (section === 'schedule') app.renderSchedule();
                else if (section === 'materials') app.renderMaterials();
                else if (section === 'attendance') loadAttendanceSheet();
            }
        };

        // ==================== GLOBAL FUNCTIONS ====================
        function toggleParentLabel() {
            const role = document.getElementById('regRole').value;
            document.getElementById('classLabel').innerHTML = role === 'parent' ? 'Chọn Lớp Của Con' : 'Chọn Lớp Đăng Ký';
        }

        function handleLogin() {
            const u = document.getElementById('loginUser').value.trim();
            const p = document.getElementById('loginPass').value;
            const error = document.getElementById('loginError');
            if (auth.login(u, p)) {
                error.classList.add('hidden');
            } else {
                error.classList.remove('hidden');
            }
        }

        function handleRegister() {
            const name = document.getElementById('regName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const pass = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;
            const cls = document.getElementById('regClass').value;
            const error = document.getElementById('registerError');

            if (!name || !phone || !pass || !cls) {
                error.innerText = 'Vui lòng điền đầy đủ thông tin!';
                error.classList.remove('hidden');
                return;
            }
            error.classList.add('hidden');

            if (auth.register(name, phone, pass, role, cls)) {
                showCustomMessage('Đăng ký thành công', 'Tài khoản đã được tạo! Vui lòng đăng nhập.', 'success', () => app.renderLogin());
            } else {
                error.innerText = 'Số điện thoại này đã được đăng ký!';
                error.classList.remove('hidden');
            }
        }

        function showCustomMessage(title, message, type, callback) {
            const modalContainer = document.getElementById('modalContainer');
            const icon = type === 'success' ? 'fas fa-check-circle text-accent-green' : 'fas fa-exclamation-triangle text-red-600';
            const btnColor = type === 'success' ? 'bg-accent-green hover:bg-green-700' : 'bg-primary-blue hover:bg-blue-700';

            modalContainer.innerHTML = `
                <div class="modal-backdrop z-[1001]" onclick="closeModal()">
                    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-sm text-center transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
                        <i class="${icon} text-5xl mb-4"></i>
                        <h3 class="text-2xl font-bold mt-2 mb-3 text-gray-800">${title}</h3>
                        <p class="text-gray-600 mb-6">${message}</p>
                        <button onclick="closeModal(); ${callback ? callback + '()' : ''}" class="py-3 px-6 text-white ${btnColor} rounded-xl font-bold shadow-md transition">Xác Nhận</button>
                    </div>
                </div>
            `;
        }

        function closeModal() {
            document.getElementById('modalContainer').innerHTML = '';
        }

        // Attendance
        function loadAttendanceSheet() {
            const cls = document.getElementById('attClass').value;
            const date = document.getElementById('attDate').value;
            const sheetDiv = document.getElementById('attendanceSheet');

            if (!cls || !date) {
                sheetDiv.innerHTML = `<p class="text-center text-gray-500 p-4">Chọn Lớp và Ngày để bắt đầu điểm danh.</p>`;
                return;
            }

            const users = db.get(DB_KEYS.USERS, []);
            const students = users.filter(u => u.role === 'student' && u.classId === cls).sort((a,b) => a.name.localeCompare(b.name, 'vi'));
            const attData = db.get(DB_KEYS.ATTENDANCE, {});
            const key = `${cls}_${date}`;
            const currentAtt = attData[key] || {};

            let html = `<div class="overflow-x-auto rounded-xl shadow-md border border-gray-200">
                <table class="responsive-table">
                    <thead><tr class="bg-primary-blue text-white">
                        <th class="w-16">STT</th><th>Họ Tên</th><th class="w-24 text-center">Có Mặt</th><th class="min-w-[200px]">Ghi Chú</th>
                    </tr></thead><tbody>`;

            if (students.length === 0) {
                html += `<tr><td colspan="4" class="p-4 text-center text-gray-500 bg-white">Không có học sinh trong lớp này.</td></tr>`;
            } else {
                students.forEach((s, i) => {
                    const present = currentAtt[s.id]?.present || false;
                    const note = currentAtt[s.id]?.note || '';
                    html += `
                        <tr class="${present ? 'bg-accent-green/10' : 'bg-red-50'} hover:!bg-gray-100 transition duration-150">
                            <td class="text-center">${i+1}</td>
                            <td class="font-bold text-gray-800">${s.name}</td>
                            <td class="text-center">
                                <input type="checkbox" class="w-5 h-5 accent-secondary-orange cursor-pointer" onchange="saveAttendance('${cls}','${date}','${s.id}',this.checked)" ${present ? 'checked' : ''}>
                            </td>
                            <td>
                                <input type="text" class="w-full text-sm p-2 border-2 border-transparent focus:border-primary-blue rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-blue/50 bg-transparent" value="${note}" placeholder="Vắng có phép, bệnh..." onblur="saveAttendanceNote('${cls}','${date}','${s.id}',this.value)">
                            </td>
                        </tr>`;
                });
            }
            html += `</tbody></table></div>`;
            sheetDiv.innerHTML = html;
        }

        function saveAttendance(cls, date, studentId, present) {
            const attData = db.get(DB_KEYS.ATTENDANCE, {});
            const key = `${cls}_${date}`;
            if (!attData[key]) attData[key] = {};
            if (!attData[key][studentId]) attData[key][studentId] = {};
            attData[key][studentId].present = present;
            db.set(DB_KEYS.ATTENDANCE, attData);
            loadAttendanceSheet();
        }

        function saveAttendanceNote(cls, date, studentId, note) {
            const attData = db.get(DB_KEYS.ATTENDANCE, {});
            const key = `${cls}_${date}`;
            if (!attData[key]) attData[key] = {};
            if (!attData[key][studentId]) attData[key][studentId] = {};
            attData[key][studentId].note = note;
            db.set(DB_KEYS.ATTENDANCE, attData);
        }

        function toggleFee(studentId, count) {
            if (currentUser.role !== 'teacher') return;
            const fees = db.get(DB_KEYS.FEES, {});
            if (!fees[studentId]) fees[studentId] = { paidCount: 0 };
            fees[studentId].paidCount = (fees[studentId].paidCount === count) ? count - 1 : count;
            db.set(DB_KEYS.FEES, fees);
            app.renderFees();
        }

        function createAssignment() {
            const title = document.getElementById('hwTitle').value.trim();
            const cls = document.getElementById('hwClass').value;
            const link = document.getElementById('hwLink').value.trim();
            const desc = document.getElementById('hwDesc').value.trim();

            if (!title || !link) {
                showCustomMessage('Lỗi nhập liệu', 'Cần nhập Tiêu đề và Link bài tập!', 'error');
                return;
            }

            const assignments = db.get(DB_KEYS.ASSIGNMENTS, []);
            assignments.push({
                id: Date.now().toString(),
                classId: cls,
                title, link, desc,
                studentId: null, parentId: null, score: null, answerText: null
            });
            db.set(DB_KEYS.ASSIGNMENTS, assignments);
            showCustomMessage('Thành công', `Đã giao bài tập cho lớp ${cls}!`, 'success');
            app.renderHomework();
        }

        function submitHomework(parentId) {
            const answer = document.getElementById(`ans-${parentId}`).value.trim();
            if (!answer) {
                showCustomMessage('Lỗi nhập liệu', 'Vui lòng nhập nội dung bài nộp!', 'error');
                return;
            }

            const assignments = db.get(DB_KEYS.ASSIGNMENTS, []);
            const parentHw = assignments.find(a => a.id === parentId);
            let existing = assignments.find(s => s.parentId === parentId && s.studentId === currentUser.id);

            if (existing) {
                existing.answerText = answer;
                existing.score = null;
            } else {
                assignments.push({
                    id: Date.now().toString(),
                    parentId, classId: currentUser.classId,
                    title: parentHw.title,
                    studentId: currentUser.id,
                    answerText: answer,
                    score: null
                });
            }
            db.set(DB_KEYS.ASSIGNMENTS, assignments);
            showCustomMessage('Thành công', 'Nộp bài thành công! Đang chờ chấm điểm.', 'success');
            app.renderStudentHomework();
        }

        function gradeAssignment(submissionId) {
            const scoreInput = document.getElementById(`score-${submissionId}`);
            const score = parseFloat(scoreInput.value);
            if (isNaN(score) || score < 0 || score > 10) {
                showCustomMessage('Lỗi điểm số', 'Điểm không hợp lệ (0-10).', 'error');
                return;
            }

            const assignments = db.get(DB_KEYS.ASSIGNMENTS, []);
            const sub = assignments.find(a => a.id === submissionId);
            if (sub) {
                sub.score = score;
                db.set(DB_KEYS.ASSIGNMENTS, assignments);
                showCustomMessage('Thành công', `Đã lưu điểm ${score}`, 'success');
                app.renderHomework();
            }
        }

        // Schedule CRUD
        function showScheduleModal(id = null) {
            const schedules = db.get(DB_KEYS.SCHEDULE, []);
            const schedule = id ? schedules.find(s => s.id === id) : {};
            const isEdit = !!id;

            const classOptions = CONSTANTS.CLASSES.map(c => `<option value="${c}" ${schedule.classId === c ? 'selected' : ''}>Lớp ${c}</option>`).join('');
            const days = ["Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7","Chủ Nhật"];
            const dayOptions = days.map(d => `<option value="${d}" ${schedule.day === d ? 'selected' : ''}>${d}</option>`).join('');

            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-backdrop z-[1001]" onclick="closeModal()">
                    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-lg transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
                        <h3 class="text-2xl font-bold ${isEdit ? 'text-primary-blue' : 'text-secondary-orange'} mb-6 border-b pb-2">${isEdit ? 'Sửa Lịch Học' : 'Thêm Lịch Học Mới'}</h3>
                        <div class="space-y-4">
                            <input type="hidden" id="schId" value="${schedule.id || ''}">
                            <select id="schClass" class="input-field">${classOptions}</select>
                            <div class="grid grid-cols-2 gap-4">
                                <select id="schDay" class="input-field">${dayOptions}</select>
                                <input type="text" id="schTime" class="input-field" value="${schedule.time || ''}" placeholder="17:30 - 19:00">
                            </div>
                            <input type="text" id="schSubject" class="input-field" value="${schedule.subject || 'Toán Bồi Dưỡng'}" placeholder="Nội dung buổi học">
                        </div>
                        <div class="mt-8 flex justify-end space-x-3">
                            <button onclick="closeModal()" class="py-3 px-6 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300 font-semibold shadow-md transition">Hủy</button>
                            <button onclick="saveSchedule()" class="btn-primary !py-3 !px-6">${isEdit ? 'Lưu Thay Đổi' : 'Thêm Lịch'}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveSchedule() {
            const id = document.getElementById('schId').value || Date.now().toString();
            const classId = document.getElementById('schClass').value;
            const day = document.getElementById('schDay').value;
            const time = document.getElementById('schTime').value.trim();
            const subject = document.getElementById('schSubject').value.trim();

            if (!classId || !day || !time) {
                showCustomMessage('Lỗi nhập liệu', 'Vui lòng điền đủ thông tin.', 'error');
                return;
            }

            const newSch = { id, classId, day, time, subject };
            let schedules = db.get(DB_KEYS.SCHEDULE, []);
            const idx = schedules.findIndex(s => s.id === id);
            if (idx > -1) {
                schedules[idx] = newSch;
            } else {
                schedules.push(newSch);
            }
            db.set(DB_KEYS.SCHEDULE, schedules);
            closeModal();
            app.updateClassView(classId, 'schedule');
            showCustomMessage('Thành công', 'Lịch học đã được lưu!', 'success');
        }

        function deleteSchedule(id) {
            if (confirm('Bạn có chắc chắn muốn xóa lịch học này?')) {
                let schedules = db.get(DB_KEYS.SCHEDULE, []);
                schedules = schedules.filter(s => s.id !== id);
                db.set(DB_KEYS.SCHEDULE, schedules);
                showCustomMessage('Thành công', 'Đã xóa lịch học.', 'success');
                app.renderSchedule();
            }
        }

        // Material CRUD
        function showMaterialModal() {
            const classOptions = CONSTANTS.CLASSES.map(c => `<option value="${c}">Lớp ${c}</option>`).join('');
            document.getElementById('modalContainer').innerHTML = `
                <div class="modal-backdrop z-[1001]" onclick="closeModal()">
                    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-lg transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
                        <h3 class="text-2xl font-bold text-secondary-orange mb-6 border-b pb-2">Tải Lên Tài Liệu Mới</h3>
                        <div class="space-y-4">
                            <select id="matClass" class="input-field">${classOptions}</select>
                            <input type="text" id="matTitle" class="input-field" placeholder="Tiêu đề tài liệu">
                            <input type="url" id="matLink" class="input-field" placeholder="https://drive.google.com/...">
                            <select id="matType" class="input-field">
                                <option value="Tài Liệu Đọc">Tài Liệu Đọc</option>
                                <option value="Bài Tập">Bài Tập</option>
                                <option value="Đề Thi">Đề Thi</option>
                            </select>
                        </div>
                        <div class="mt-8 flex justify-end space-x-3">
                            <button onclick="closeModal()" class="py-3 px-6 bg-gray-200 text-gray-700 rounded-xl hover:bg-gray-300 font-semibold shadow-md transition">Hủy</button>
                            <button onclick="saveMaterial()" class="btn-secondary !py-3 !px-6">Tải Lên</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function saveMaterial() {
            const classId = document.getElementById('matClass').value;
            const title = document.getElementById('matTitle').value.trim();
            const link = document.getElementById('matLink').value.trim();
            const type = document.getElementById('matType').value;

            if (!classId || !title || !link) {
                showCustomMessage('Lỗi nhập liệu', 'Vui lòng điền đủ thông tin.', 'error');
                return;
            }

            const newMat = { id: Date.now().toString(), classId, title, link, type };
            let materials = db.get(DB_KEYS.MATERIALS, []);
            materials.push(newMat);
            db.set(DB_KEYS.MATERIALS, materials);
            showCustomMessage('Thành công', 'Tài liệu đã được tải lên!', 'success');
            closeModal();
            app.updateClassView(classId, 'materials');
        }

        function deleteMaterial(id) {
            if (confirm('Bạn có chắc chắn muốn xóa tài liệu này?')) {
                let materials = db.get(DB_KEYS.MATERIALS, []);
                materials = materials.filter(m => m.id !== id);
                db.set(DB_KEYS.MATERIALS, materials);
                showCustomMessage('Thành công', 'Đã xóa tài liệu.', 'success');
                app.renderMaterials();
            }
        }

        // Khởi chạy ứng dụng
        app.init();
    </script>
</body>
</html>
